<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection aléatoire</title>
    <script>
        function redirectRandomly() {
            // Les URLs des trois Google Forms
            var forms = [
                "https://www.psytoolkit.org/c/3.6.0/survey?s=WjRnQ",
                "https://www.psytoolkit.org/c/3.6.0/survey?s=yfq6L"
            ];
            // Choix aléatoire
            var randomIndex = Math.floor(Math.random() * forms.length);
            var randomChoice = forms[randomIndex];
            // Redirection
            window.location.href = randomChoice;
        }
    </script>
</head>
<body onload="redirectRandomly()">
    <p>Redirection en cours...</p>
</body>
</html>
